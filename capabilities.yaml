defaults:
  discover: deny
  invoke: deny

agents:
  main:
    discover:
      - native.read
      - context7.*
      - rag.*
    invoke:
      allow:
        - native.read
        - context7.*
        - rag.*
      ask: []
      deny: []

  repository:
    discover:
      - repository.get_repo_tree
      - repository.search_code
      - repository.read_file
      - repository.read_files
      - repository.find_symbol
      - repository.find_references
      - repository.get_file_history
      - context7.*
      - rag.*
      - skill.debug
      - native.read
    invoke:
      allow:
        - repository.get_repo_tree
        - repository.search_code
        - repository.read_file
        - repository.read_files
        - repository.find_symbol
        - repository.find_references
        - repository.get_file_history
        - context7.*
        - rag.*
        - skill.debug
        - native.read
      ask:
        - github.commit_to_default_branch
      deny: []

  issues:
    discover:
      - github.list_issues
      - github.get_issue
      - github.get_issue_comments
      - github.list_milestones
      - repository.get_repo_tree
      - repository.search_code
      - repository.read_file
      - repository.read_files
      - repository.find_symbol
      - repository.find_references
      - github.post_comment
      - github.create_issue
      - github.update_issue
      - github.set_issue_lock
      - context7.*
      - rag.*
      - skill.debug
      - native.read
    invoke:
      allow:
        - github.list_issues
        - github.get_issue
        - github.get_issue_comments
        - github.list_milestones
        - repository.get_repo_tree
        - repository.search_code
        - repository.read_file
        - repository.read_files
        - repository.find_symbol
        - repository.find_references
        - context7.*
        - rag.*
        - skill.debug
        - native.read
      ask:
        - github.post_comment
        - github.create_issue
        - github.update_issue
        - github.set_issue_lock
        - github.create_branch
        - github.commit
        - github.push
        - github.create_draft_pr
      deny: []

  pull_requests:
    discover:
      - github.list_pull_requests
      - github.get_pr
      - github.get_pr_comments
      - github.get_pr_reviews
      - github.get_workflow_runs
      - github.get_job_logs
      - repository.get_repo_tree
      - repository.search_code
      - repository.read_file
      - repository.read_files
      - repository.find_symbol
      - repository.find_references
      - repository.get_pr_diff
      - repository.get_changed_files
      - github.post_review
      - github.commit
      - github.merge
      - context7.*
      - rag.*
      - skill.code-review
      - skill.debug
      - native.read
    invoke:
      allow:
        - github.list_pull_requests
        - github.get_pr
        - github.get_pr_comments
        - github.get_pr_reviews
        - github.get_workflow_runs
        - github.get_job_logs
        - repository.get_repo_tree
        - repository.search_code
        - repository.read_file
        - repository.read_files
        - repository.find_symbol
        - repository.find_references
        - repository.get_pr_diff
        - repository.get_changed_files
        - context7.*
        - rag.*
        - skill.code-review
        - skill.debug
        - native.read
      ask:
        - github.post_review
        - github.commit
        - github.merge
      deny: []

  coding:
    discover:
      - repository.get_default_branch
      - repository.get_file_status
      - repository.get_repo_tree
      - repository.search_code
      - repository.read_file
      - repository.read_files
      - repository.find_symbol
      - repository.find_references
      - native.read
      - native.glob
      - native.grep
      - native.now
      - native.write
      - native.edit
      - native.delete
      - native.bash
      - context7.*
      - rag.*
      - skill.code-review
      - skill.debug
    invoke:
      allow:
        - repository.get_default_branch
        - repository.get_file_status
        - repository.get_repo_tree
        - repository.search_code
        - repository.read_file
        - repository.read_files
        - repository.find_symbol
        - repository.find_references
        - native.read
        - native.glob
        - native.grep
        - native.now
        - native.write
        - native.edit
        - native.delete
        - native.bash
        - context7.*
        - rag.*
        - skill.code-review
        - skill.debug
      ask: []
      deny: []
    bash_profile: coding
