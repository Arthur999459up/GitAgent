[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitagent"
version = "0.1.0"
description = "A safe, auditable multi-agent assistant for GitHub repository maintenance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai>=1.0,<3.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = ["pytest>=7.0", "ruff>=0.9.0"]

[project.scripts]
gitagent = "gitagent.app.cli:main"

[tool.setuptools.packages.find]
include = ["gitagent*"]

[tool.setuptools.package-data]
gitagent = ["prompts/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
